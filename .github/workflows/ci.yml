name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          lein: 2.11.2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.lein
          key: deps-${{ hashFiles('project.clj') }}
          restore-keys: deps-

      - name: Lint
        run: lein clj-kondo --lint src test

      - name: Format check
        run: lein cljfmt check

      - name: Test
        run: lein test
